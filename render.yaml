services:
  # 1. Backend Service (FastAPI)
  - type: web
    name: mota-scholarship-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DIGILOCKER_MODE
        value: demo
      - key: FAST2SMS_API_KEY
        value: 1aA54TR0gKvrNCnZF7edLPWmBz2E3XjqxhflQtsG9HoSV6UpM8410aIUxiHhoWXRPtZsvjND2LwzVr6e

  # 2. Frontend Service (Next.js)
  - type: web
    name: mota-scholarship-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        fromService:
          type: web
          name: mota-scholarship-backend
          property: host
